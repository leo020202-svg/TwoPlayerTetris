app = "twoplayertetris"
primary_region = "ams"

[build]

[env]
  STATS_FILE = "/data/stats.json"

# Keeps the internal visitor stats across deploys and restarts.
[mounts]
  source = "stats_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
